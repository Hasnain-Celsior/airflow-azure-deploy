name: Trigger auto deployment for airflow

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/airflow-AutoDeployTrigger-094c5f8d-40b9-499e-96f0-6344b4da999b.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AIRFLOW_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/airflow
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: airag.azurecr.io
          registryUsername: ${{ secrets.AIRFLOW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIRFLOW_REGISTRY_PASSWORD }}
          containerAppName: airflow
          resourceGroup: AI-POC-Avinash.Singh
          imageToBuild: airag.azurecr.io/airflow:${{ github.sha }}
          
            

     

