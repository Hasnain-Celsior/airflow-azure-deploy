name: Trigger auto deployment for airflow

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ main ]
    paths:
    - 'airflow/**'
    - '.github/workflows/airflow-AutoDeployTrigger-f3ba2397-4ffa-4e56-90bc-6992f4d7ebd9.yml'

  # Allow manual trigger
  workflow_dispatch:

# Newer pushes cancel in-progress runs, so a slow older build can't finish
# last and deploy stale code.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AIRFLOW_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/airflow
          dockerfilePath: Dockerfile
          registryUrl: airag.azurecr.io
          registryUsername: ${{ secrets.AIRFLOW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIRFLOW_REGISTRY_PASSWORD }}
          containerAppName: airflow
          resourceGroup: AI-POC-Avinash.Singh
          imageToBuild: airag.azurecr.io/airflow:${{ github.sha }}
