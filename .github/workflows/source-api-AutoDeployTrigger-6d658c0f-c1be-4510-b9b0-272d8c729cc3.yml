name: Trigger auto deployment for source-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ main ]
    paths:
    - 'source-api/**'
    - '.github/workflows/source-api-AutoDeployTrigger-6d658c0f-c1be-4510-b9b0-272d8c729cc3.yml'

  # Allow manual trigger
  workflow_dispatch:

# Newer pushes cancel in-progress runs, so a slow older build can't finish
# last and deploy stale code.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.SOURCEAPI_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/source-api
          dockerfilePath: Dockerfile
          registryUrl: airag.azurecr.io
          registryUsername: ${{ secrets.SOURCEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SOURCEAPI_REGISTRY_PASSWORD }}
          containerAppName: source-api
          resourceGroup: AI-POC-Avinash.Singh
          imageToBuild: airag.azurecr.io/source-api:${{ github.sha }}
